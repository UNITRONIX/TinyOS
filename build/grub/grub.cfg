set timeout=0
set default=0

menuentry "TinyOS" {
    multiboot /boot/tinyos.kernel
    module /boot/modules/initrd-placeholder.txt initrd-placeholder
    boot
}

# UEFI GRUB can prefer Multiboot2 when the kernel header is present.
menuentry "TinyOS (Multiboot2)" {
    multiboot2 /boot/tinyos.kernel
    module2 /boot/modules/initrd-placeholder.txt initrd-placeholder
    boot
}
